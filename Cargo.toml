[package]
name = "sir"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix="0.13"
actix-web-actors = "4"   # WebSocket support
actix-rt = "2"           # Actix runtime
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
rand = { version = "0.8", features = ["getrandom"] }
env_logger = "0.11.8"
dotenv = "0.15.0"
redis = "1.0.3"
base64 = "0.22.1"
sha2 = { version = "0.10.9", features = ["oid"] }
chrono = "0.4.43"
hex-literal = "1.1.0"
hex = "0.4.3"
rsa = "0.9.10"
signature = "2.2.0"
