[package]
name = "sir"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix="0.13"
actix-web-actors = "4"   # WebSocket support
actix-rt = "2"           # Actix runtime
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
rand = "0.10.0"
env_logger = "0.11.8"
dotenv = "0.15.0"
